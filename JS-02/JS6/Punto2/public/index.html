<body>
    <!-- creo el formulario -->
    <form id="formulario">
        <div class="titulo">
            <h1>Formulario</h1>
        </div>
        <div class="mb-3">
            <label for="exampleInputEmail1" class="form-label">Ingrese su nombre</label>
            <input type="text" class="form-control" id="nombre" placeholder="Ejemplo: Juan" required>
        </div>
        <div class="mb-3">
            <label for="exampleInputEmail1" class="form-label">Ingrese su mail</label>
            <input type="text" class="form-control" id="email" placeholder="Ejemplo: juan1@gmail.com" required>
        </div>
        <button type="submit" class="btn btn-primary">Guardar</button>
    </form>

    <!-- muestro la id correspondiente -->
    <ul id="lista"></ul>

<script src="./script.js"></script>
